[workspace]
members = ["crates/freshen-lib", "crates/freshen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yildirimarda/freshen"
homepage = "https://github.com/yildirimarda/freshen"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"