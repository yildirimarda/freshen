name: linux-containers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the stub-based integration tests inside containers for the three main
  # Linux distributions freshen supports on Linux (Ubuntu, Fedora, Arch). The
  # Linux steps (apt, dnf, pacman, ...) are Linux-only, so running them against
  # stub package managers on each distribution proves the parsers and call
  # transcripts work on the real distro userland instead of only on the Ubuntu
  # runner the `rust` job uses. The tests never call the real brew, apt, dnf,
  # pacman, uv or mise — they use temporary stub executables on PATH.
  #
  # The container images ship neither git nor a Rust toolchain. Build
  # dependencies (git is needed by actions/checkout) are installed first with
  # each distribution's own package manager, then rustup is installed and
  # `rustup toolchain install` reads rust-toolchain.toml, exactly like the
  # `rust` job does on the runners. No OpenSSL headers: the dependency tree is
  # rustls + ring (see Cargo.lock), which only needs a C compiler.
  linux-containers:
    name: linux-containers (${{ matrix.container }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:24.04, fedora:latest, archlinux:latest]
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Install build dependencies (${{ matrix.container }})
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y && apt-get install -y --no-install-recommends \
              git build-essential curl ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git gcc gcc-c++ make curl ca-certificates
          elif command -v pacman >/dev/null 2>&1; then
            # -Syu, never a bare -Sy: a partial upgrade can leave Arch broken.
            pacman -Syu --needed --noconfirm git base-devel curl ca-certificates
          else
            echo "::error::no supported package manager found in ${{ matrix.container }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact channel (with rustfmt + clippy) and
      # the release targets. rustup is not preinstalled in these images, so
      # install it without a default toolchain, then let it install what the
      # file asks for.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Stub-based integration tests
        run: cargo test --all-features --tests
