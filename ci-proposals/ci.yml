name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The zsh implementation and its deprecated sh wrapper are gone; this
      # guard fails if the compatibility shim is ever reintroduced by accident.
      - name: update-all.sh shim removed
        run: test ! -e update-all.sh

      - name: Bash syntax (agentloop scripts)
        run: |
          bash -n run.sh
          bash -n setup-github.sh

      - name: Workflow YAML validity
        run: |
          python3 - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              yaml.safe_load(open(f))
              print("ok", f)
          PY

      - name: Repository checks
        run: bash tests/run-tests.sh

      # Rust phase: active as soon as the Cargo workspace exists (PLAN.md Milestone 2).
      - name: Rust fmt, clippy, tests
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --all-features
          else
            echo "no Cargo workspace yet"
          fi
