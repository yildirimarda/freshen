name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the exact channel (with rustfmt + clippy) and
      # the release targets, so rustup picks them up from the checkout.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --all-features

  # cargo-deny gates licenses (against deny.toml's allow-list) and known
  # vulnerabilities (RustSec advisories) for the whole dependency tree, so a
  # new dependency can never slip a non-permissive license or a vulnerable
  # crate past review. The version is pinned to keep the checks reproducible;
  # bump it deliberately when CI requires a newer cargo-deny.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories