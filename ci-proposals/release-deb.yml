# Build a Debian/Ubuntu .deb package from the freshen binary and publish it
# as a GitHub Release asset on every git tag matching `v*`.
#
# The package installs freshen to /usr/bin/freshen (mode 0755, owned by root)
# for amd64 and arm64, and is built with dpkg-deb on ubuntu-latest.
#
# Apply this proposal:
#   git mv ci-proposals/release-deb.yml .github/workflows/release-deb.yml
#
# It needs no repository secrets beyond the default GITHUB_TOKEN
# (contents: write).
#
# This workflow is triggered by the same `v*` tags as release-binaries and
# runs concurrently with it. It waits for the release-binaries release to
# appear for the tag, then uploads the .deb packages (and a checksums file)
# as additional assets on the same release. release-binaries owns the release
# itself (including `make_latest: true`); this workflow only adds assets to it.
# Apply release-binaries first, or the .deb jobs wait and eventually fail.

name: release-deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: build freshen .deb for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the Linux target
        run: rustup target add ${{ matrix.target }}

      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build freshen in release mode
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - id: stage
        name: Stage the .deb package
        env:
          VERSION: ${{ github.inputs.tag || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) DEB_ARCH=amd64 ;;
            aarch64-unknown-linux-gnu) DEB_ARCH=arm64 ;;
            *) echo "::error::unsupported target ${{ matrix.target}}" >&2; exit 1 ;;
          esac
          PKG_ROOT="dist/deb-${{ matrix.target }}"
          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN" "$PKG_ROOT/usr/bin"
          install -m 0755 "target/${{ matrix.target }}/release/freshen" \
            "$PKG_ROOT/usr/bin/freshen"
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: freshen
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Maintainer: freshen <freshen@yildirimarda.com>
          Depends:
          Description: Keep a developer machine up to date
           freshen updates Homebrew, apt, dnf, winget, Chocolatey, Scoop,
           uv, mise, Docker, Colima and more from a single command.
          EOF
          dpkg-deb --build "$PKG_ROOT" \
            "dist/freshen-${VERSION}-${DEB_ARCH}.deb"
          echo "deb=dist/freshen-${VERSION}-${DEB_ARCH}.deb" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-deb-${{ matrix.target }}
          path: dist/freshen-*.deb

  release:
    name: upload the .deb packages to the release
    needs: build-deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download every built .deb
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # release-binaries creates the release for this tag; both workflows start
      # on the same tag push and run concurrently, so wait for it to appear.
      - name: Wait for the release-binaries release for this tag
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          ok=0
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::release for $tag never appeared (is release-binaries applied?)" >&2; exit 1; }

      - name: Write the combined checksums file for the .deb packages
        run: |
          cd dist
          sha256sum */freshen-*.deb > checksums-deb.txt
          cat checksums-deb.txt

      - name: Upload the .deb packages and checksums to the release
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/*/freshen-*.deb dist/checksums-deb.txt
