# Prebuilt binaries for every target freshen supports, published as a GitHub
# Release on every git tag matching `v*`.
#
# The assets are named `freshen-<version>-<target>.tar.gz` (Unix) and
# `freshen-<version>-<target>.zip` (Windows), which is what `cargo binstall`
# looks for when it resolves a crate from crates.io to its GitHub repository
# and downloads the release asset matching the current target triple
# (see binstalk-fetchers/src/gh_crate_meta/hosting.rs in cargo-binstall).
#
# This is an equivalent of cargo-dist: it builds freshen for every target in
# a matrix, archives each binary, writes a combined checksums file, creates
# the GitHub Release for the tag, and uploads every archive plus the checksums
# file as release assets. cargo-dist is intentionally not used, so the repo
# does not take on another tool and the workflow keeps full control over the
# matrix and the artifact names.
#
# Release signing (Milestone 11, later items) is deliberately out of scope.
#
# Apply this proposal:
#   git mv ci-proposals/release-binaries.yml .github/workflows/release-binaries.yml
#
# It needs no repository secrets beyond the default GITHUB_TOKEN
# (contents: write). Each git tag releases exactly once; re-running for an
# already-released tag fails until that release is removed.
#
# This workflow supersedes ci-proposals/release-macos.yml and
# ci-proposals/release-linux-windows.yml: both of those create a release for
# the same `v*` tags and upload bare `freshen`/`freshen.exe` assets that
# `cargo binstall` cannot discover. Only one release workflow should be
# applied.

name: release-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: build freshen for ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the macOS target
        run: rustup target add ${{ matrix.target }}

      - name: Build freshen in release mode
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary archive and its checksum
        env:
          VERSION: ${{ github.inputs.tag || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p "dist/${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/freshen" \
            "dist/${{ matrix.target }}/freshen"
          tar -czf "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz" \
            -C "dist/${{ matrix.target }}" freshen
          sha256sum "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz" \
            > "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  build-linux:
    name: build freshen for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the Linux target
        run: rustup target add ${{ matrix.target }}

      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build freshen in release mode
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary archive and its checksum
        env:
          VERSION: ${{ github.inputs.tag || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p "dist/${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/freshen" \
            "dist/${{ matrix.target }}/freshen"
          tar -czf "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz" \
            -C "dist/${{ matrix.target }}" freshen
          sha256sum "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz" \
            > "dist/${{ matrix.target }}/freshen-${VERSION}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  build-windows:
    name: build freshen for ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the Windows target
        run: rustup target add ${{ matrix.target }}

      - name: Build freshen in release mode
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary archive and its checksum
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.inputs.tag || github.ref_name }}
        run: |
          $VERSION = "${env:VERSION}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path "dist\$env:TARGET" | Out-Null
          Copy-Item "target\$env:TARGET\release\freshen.exe" "dist\$env:TARGET\freshen.exe"
          Compress-Archive -Path "dist\$env:TARGET\freshen.exe" `
            -DestinationPath "dist\$env:TARGET\freshen-$env:VERSION-$env:TARGET.zip" -Force
          (Get-FileHash "dist\$env:TARGET\freshen-$env:VERSION-$env:TARGET.zip" -Algorithm SHA256).Hash `
            | Set-Content "dist\$env:TARGET\freshen-$env:VERSION-$env:TARGET.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist\${{ matrix.target }}\

  release:
    name: create GitHub Release and upload every binary archive
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every built archive
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write the combined checksums file
        run: |
          cd dist
          sha256sum \
            freshen-aarch64-apple-darwin/freshen-*-aarch64-apple-darwin.tar.gz \
            freshen-x86_64-apple-darwin/freshen-*-x86_64-apple-darwin.tar.gz \
            freshen-x86_64-unknown-linux-gnu/freshen-*-x86_64-unknown-linux-gnu.tar.gz \
            freshen-aarch64-unknown-linux-gnu/freshen-*-aarch64-unknown-linux-gnu.tar.gz \
            freshen-x86_64-unknown-linux-musl/freshen-*-x86_64-unknown-linux-musl.tar.gz \
            freshen-aarch64-unknown-linux-musl/freshen-*-aarch64-unknown-linux-musl.tar.gz \
            freshen-x86_64-pc-windows-msvc/freshen-*-x86_64-pc-windows-msvc.zip \
            freshen-aarch64-pc-windows-msvc/freshen-*-aarch64-pc-windows-msvc.zip > checksums.txt
          cat checksums.txt

      - name: Create the GitHub Release for this tag
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          name: freshen ${{ github.inputs.tag || github.ref_name }}
          body: |
            ## freshen ${{ github.inputs.tag || github.ref_name }}

            Prebuilt binaries (installable with `cargo binstall freshen`):

            - `freshen-<version>-aarch64-apple-darwin.tar.gz` — macOS Apple silicon
            - `freshen-<version>-x86_64-apple-darwin.tar.gz` — macOS Intel
            - `freshen-<version>-x86_64-unknown-linux-gnu.tar.gz` — Linux x86_64 (glibc)
            - `freshen-<version>-aarch64-unknown-linux-gnu.tar.gz` — Linux aarch64 (glibc)
            - `freshen-<version>-x86_64-unknown-linux-musl.tar.gz` — Linux x86_64, fully static (musl)
            - `freshen-<version>-aarch64-unknown-linux-musl.tar.gz` — Linux aarch64, fully static (musl)
            - `freshen-<version>-x86_64-pc-windows-msvc.zip` — Windows x86_64
            - `freshen-<version>-aarch64-pc-windows-msvc.zip` — Windows aarch64 (ARM 64-bit)

            Verify a download against `checksums.txt`:

                sha256sum -c checksums.txt
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archives and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          files: |
            dist/freshen-aarch64-apple-darwin/freshen-*-aarch64-apple-darwin.tar.gz
            dist/freshen-x86_64-apple-darwin/freshen-*-x86_64-apple-darwin.tar.gz
            dist/freshen-x86_64-unknown-linux-gnu/freshen-*-x86_64-unknown-linux-gnu.tar.gz
            dist/freshen-aarch64-unknown-linux-gnu/freshen-*-aarch64-unknown-linux-gnu.tar.gz
            dist/freshen-x86_64-unknown-linux-musl/freshen-*-x86_64-unknown-linux-musl.tar.gz
            dist/freshen-aarch64-unknown-linux-musl/freshen-*-aarch64-unknown-linux-musl.tar.gz
            dist/freshen-x86_64-pc-windows-msvc/freshen-*-x86_64-pc-windows-msvc.zip
            dist/freshen-aarch64-pc-windows-msvc/freshen-*-aarch64-pc-windows-msvc.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
