# Prebuilt Linux (x86_64 and aarch64; glibc and fully static musl) and Windows
# (x86_64 and aarch64) binaries with SHA-256 checksums, published as a GitHub
# Release on every git tag matching `v*`.
#
# This is an equivalent of cargo-dist: it builds freshen for every target in
# a matrix, writes a combined checksums file, creates the GitHub Release for
# the tag, and uploads every binary plus the checksums file as release
# assets. cargo-dist is intentionally not used, so the repo does not take on
# another tool and the workflow keeps full control over the matrix and the
# artifact names.
#
# Release signing (Milestone 11, later items) is deliberately out of scope.
#
# This workflow and ci-proposals/release-macos.yml both trigger on `v*` tags
# and each creates the release for that tag — apply only one release workflow
# (or merge them into a single file) before moving either to
# .github/workflows/.
#
# Apply this proposal:
#   git mv ci-proposals/release-linux-windows.yml .github/workflows/release-linux-windows.yml
#
# It needs no repository secrets beyond the default GITHUB_TOKEN
# (contents: write). Each git tag releases exactly once; re-running for an
# already-released tag fails until that release is removed.

name: release-linux-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-linux-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build freshen for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the Linux target
        run: rustup target add ${{ matrix.target }}

      - name: Install the aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build freshen in release mode
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary and its checksum
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/freshen" \
            "dist/${{ matrix.target }}/freshen"
          (cd "dist/${{ matrix.target }}" && sha256sum freshen > freshen.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  build-windows:
    name: build freshen for ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the Windows target
        run: rustup target add ${{ matrix.target }}

      - name: Build freshen in release mode
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary and its checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist\$env:TARGET" | Out-Null
          Copy-Item "target\$env:TARGET\release\freshen.exe" "dist\$env:TARGET\freshen.exe"
          (Get-FileHash "dist\$env:TARGET\freshen.exe" -Algorithm SHA256).Hash |
            Set-Content "dist\$env:TARGET\freshen.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist\${{ matrix.target }}\

  release:
    name: create GitHub Release and upload Linux and Windows binaries
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every built binary
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write the combined checksums file
        run: |
          cd dist
          sha256sum \
            freshen-x86_64-unknown-linux-gnu/freshen \
            freshen-aarch64-unknown-linux-gnu/freshen \
            freshen-x86_64-unknown-linux-musl/freshen \
            freshen-aarch64-unknown-linux-musl/freshen \
            freshen-x86_64-pc-windows-msvc/freshen.exe \
            freshen-aarch64-pc-windows-msvc/freshen.exe > checksums.txt
          cat checksums.txt

      - name: Create the GitHub Release for this tag
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          name: freshen ${{ github.inputs.tag || github.ref_name }}
          body: |
            ## freshen ${{ github.inputs.tag || github.ref_name }}

            Prebuilt binaries:

            - `freshen-x86_64-unknown-linux-gnu` — Linux x86_64 (glibc)
            - `freshen-aarch64-unknown-linux-gnu` — Linux aarch64 (glibc, ARM 64-bit)
            - `freshen-x86_64-unknown-linux-musl` — Linux x86_64, fully static (musl)
            - `freshen-aarch64-unknown-linux-musl` — Linux aarch64, fully static (musl)
            - `freshen-x86_64-pc-windows-msvc` — Windows x86_64
            - `freshen-aarch64-pc-windows-msvc` — Windows aarch64 (ARM 64-bit)

            Verify a download against `checksums.txt`:

                sha256sum -c checksums.txt
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          files: |
            dist/freshen-x86_64-unknown-linux-gnu/freshen
            dist/freshen-aarch64-unknown-linux-gnu/freshen
            dist/freshen-x86_64-unknown-linux-musl/freshen
            dist/freshen-aarch64-unknown-linux-musl/freshen
            dist/freshen-x86_64-pc-windows-msvc/freshen.exe
            dist/freshen-aarch64-pc-windows-msvc/freshen.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
