# Prebuilt macOS binaries (arm64 and x86_64) with SHA-256 checksums,
# published as a GitHub Release on every git tag matching `v*`.
#
# This is an equivalent of cargo-dist: it builds freshen for both macOS
# targets in a matrix, writes a combined checksums file, creates the GitHub
# Release for the tag, and uploads every binary plus the checksums file as
# release assets. cargo-dist is intentionally not used, so the repo does not
# take on another tool and the workflow keeps full control over the two-arch
# macOS matrix and the artifact names.
#
# Release signing/notarization (Milestone 11, later items) is deliberately
# out of scope here.
#
# Apply this proposal:
#   git mv ci-proposals/release-macos.yml .github/workflows/release-macos.yml
#
# It needs no repository secrets beyond the default GITHUB_TOKEN
# (contents: write). Each git tag releases exactly once; re-running for an
# already-released tag fails until that release is removed.

name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build freshen for ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Add the macOS target
        run: rustup target add ${{ matrix.target }}

      - name: Build freshen in release mode
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary and its checksum
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/freshen" \
            "dist/${{ matrix.target }}/freshen"
          (cd "dist/${{ matrix.target }}" && shasum -a 256 freshen > freshen.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: freshen-${{ matrix.target }}
          path: dist/${{ matrix.target }}/

  release:
    name: create GitHub Release and upload macOS binaries
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every built binary
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Write the combined checksums file
        run: |
          cd dist
          shasum -a 256 \
            freshen-aarch64-apple-darwin/freshen \
            freshen-x86_64-apple-darwin/freshen > checksums.txt
          cat checksums.txt

      - name: Create the GitHub Release for this tag
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          name: freshen ${{ github.inputs.tag || github.ref_name }}
          body: |
            ## freshen ${{ github.inputs.tag || github.ref_name }}

            Prebuilt macOS binaries:

            - `freshen-aarch64-apple-darwin` — Apple silicon Macs
            - `freshen-x86_64-apple-darwin` — Intel Macs

            Verify a download against `checksums.txt`:

                shasum -a 256 -c checksums.txt
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.inputs.tag || github.ref_name }}
          files: |
            dist/freshen-aarch64-apple-darwin/freshen
            dist/freshen-x86_64-apple-darwin/freshen
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
