site_name: freshen
site_description: One command to keep a developer machine current
site_url: https://yildirimarda.github.io/freshen/
repo_url: https://github.com/yildirimarda/freshen
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - content.tooltips

