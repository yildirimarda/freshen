# Automatic version bump + CHANGELOG + tag + release, driven by
# Conventional Commits.
#
# REQUIRED REPO SETTING — without it this workflow fails on its first run
# with "GitHub Actions is not permitted to create or approve pull requests":
#   Settings -> Actions -> General -> Workflow permissions
#     -> Read and write permissions
#     -> [x] Allow GitHub Actions to create and approve pull requests
#
# How it works: after every merge to main it opens a "release PR" built from
# the accumulated commits. Merging that PR creates the tag and the GitHub
# release.
#
# If you want this fully hands-off, uncomment the second job below. Leaving
# the version bump to a human review is usually a healthy brake, though.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:      # manual trigger: gh workflow run release

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT (AUTOMERGE_TOKEN), not GITHUB_TOKEN: PRs opened by the
          # default token don't trigger their own CI (GitHub's recursion
          # guard) and can land in the "awaiting maintainer approval" queue —
          # required checks then block the release PR forever.
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          # Match your project: python | node | simple | terraform-module ...
          release-type: simple

