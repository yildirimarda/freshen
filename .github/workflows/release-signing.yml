# Sign prebuilt release binaries so users can verify their origin:
#
#   macOS: code sign every archive with the Apple Developer ID certificate
#          (hardened runtime, secure timestamp), notarize it with Apple's
#          notary service (notarytool) and re-upload it over the unsigned
#          asset.
#   Windows: sign every archive's freshen.exe with signtool and the
#            code-signing certificate (RFC 3161 timestamp).
#
# release-binaries creates the release and uploads the unsigned archives
# first; this workflow downloads them, signs them in place, and re-uploads
# them over the unsigned assets (--clobber), then refreshes checksums.txt so
# it matches the signed artifacts. Both workflows are triggered by the same
# `v*` tag, so the signing jobs poll until the assets show up.
#
# A platform whose signing secrets are not all set is skipped with a notice,
# so a project without certificates still releases (unsigned) instead of
# failing every tag. Once the secrets exist, the platform is signed.
#
# Repository secrets that only a human can create (see HUMAN-TASKS.md):
#   APPLE_DEVELOPER_CERTIFICATE   base64-encoded Developer ID code-signing .p12
#   APPLE_CERTIFICATE_PASSWORD    password that decrypts the .p12
#   APPLE_DEVELOPER_ID            code-signing identity, e.g.
#                                 "Developer ID Application: freshen (TEAMID)"
#   APPLE_ID                      Apple ID used to talk to notarytool
#   APPLE_TEAM_ID                 10-character Apple developer team ID
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for notarytool
#   WINDOWS_CODE_SIGNING_CERTIFICATE  base64-encoded code-signing .pfx
#   WINDOWS_CODE_SIGNING_PASSWORD     password that decrypts the .pfx

name: release-signing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to sign (for example v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides per platform whether every secret it needs is present. Secrets
  # cannot be read in a job-level `if`, so they are checked here.
  check-secrets:
    name: check the signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.check.outputs.macos }}
      windows: ${{ steps.check.outputs.windows }}
    steps:
      - id: check
        env:
          APPLE_DEVELOPER_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          WINDOWS_CODE_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
          WINDOWS_CODE_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          if [ -n "$APPLE_DEVELOPER_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_DEVELOPER_ID" ] && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the Apple signing secrets are not all set; macOS binaries stay unsigned"
          fi
          if [ -n "$WINDOWS_CODE_SIGNING_CERTIFICATE" ] && [ -n "$WINDOWS_CODE_SIGNING_PASSWORD" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the Windows signing secrets are not all set; Windows binaries stay unsigned"
          fi

  sign-macos:
    name: sign and notarize macOS binaries
    needs: check-secrets
    if: needs.check-secrets.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve the tag to sign
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # release-binaries creates the release and uploads the archives; wait
      # until both macOS archives are there (the same tag push starts both
      # workflows and they run concurrently).
      - name: Wait for and download the unsigned macOS archives
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          ok=0
          for i in $(seq 1 60); do
            rm -rf dist/macos
            gh release download "$tag" \
              -p 'freshen-*-aarch64-apple-darwin.tar.gz' \
              -p 'freshen-*-x86_64-apple-darwin.tar.gz' \
              -D dist/macos 2>/dev/null || true
            if [ "$(ls dist/macos/freshen-*.tar.gz 2>/dev/null | wc -l | tr -d ' ')" -ge 2 ]; then
              ok=1; break
            fi
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::macOS release assets for $tag never appeared (is release-binaries applied?)" >&2; exit 1; }

      - name: Import the Apple Developer ID certificate into a keychain
        env:
          APPLE_DEVELOPER_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$APPLE_DEVELOPER_CERTIFICATE" | base64 -D > dist/macos/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dist/macos/cert.p12 -k build.keychain \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f dist/macos/cert.p12

      # Notarization takes a zip, pkg or dmg, not a tar.gz: sign the binary,
      # submit it zipped, and put the signed binary back into the archive.
      - name: Code sign and notarize the macOS binaries
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          cat > dist/macos/entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><false/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><false/>
            <key>com.apple.security.cs.debugger</key><false/>
            <key>com.apple.security.cs.disable-library-validation</key><false/>
          </dict>
          </plist>
          EOF
          for archive in dist/macos/freshen-*-*.tar.gz; do
            dir="dist/macos/signed-$(basename "$archive" .tar.gz)"
            rm -rf "$dir"; mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            codesign --sign "$APPLE_DEVELOPER_ID" \
                --entitlements dist/macos/entitlements.plist \
                --options runtime --timestamp -v "$dir/freshen"
            ditto -c -k --keepParent "$dir/freshen" "$dir/freshen.zip"
            xcrun notarytool submit "$dir/freshen.zip" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            tar -czf "$archive" -C "$dir" freshen
          done

      - name: Upload the signed macOS archives over the unsigned assets
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/macos/freshen-*-*.tar.gz --clobber

  sign-windows:
    name: sign Windows binaries
    needs: check-secrets
    if: needs.check-secrets.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve the tag to sign
        id: tag
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Same concurrency as the macOS job: download retries until both
      # release-binaries archives exist for this tag.
      - name: Wait for and download the unsigned Windows archives
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $ok = $false
          for ($i = 1; $i -le 60; $i++) {
            if (Test-Path dist\windows) { Remove-Item -Recurse -Force dist\windows }
            gh release download $tag `
              -p 'freshen-*-x86_64-pc-windows-msvc.zip' `
              -p 'freshen-*-aarch64-pc-windows-msvc.zip' `
              -D dist\windows 2>$null
            $found = @(Get-ChildItem dist\windows\freshen-*.zip -ErrorAction SilentlyContinue).Count
            if ($found -ge 2) { $ok = $true; break }
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { throw "Windows release assets for $tag never appeared (is release-binaries applied?)" }

      - name: Decode the Windows code-signing certificate
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_CERTIFICATE)
          [IO.File]::WriteAllBytes("dist\windows\cert.pfx", $bytes)

      # signtool ships with the Windows SDK but is not on PATH on the runner.
      - name: Sign the Windows binaries with signtool (timestamped)
        env:
          WINDOWS_CODE_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }
          Get-ChildItem dist\windows\freshen-*.zip | ForEach-Object {
            $dir = Join-Path $_.DirectoryName $_.BaseName
            Expand-Archive -Path $_.FullName -DestinationPath $dir -Force
            & $signtool.FullName sign /f dist\windows\cert.pfx `
              /p $env:WINDOWS_CODE_SIGNING_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 /v `
              (Join-Path $dir freshen.exe)
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $_.FullName -Force
          }
          Remove-Item -Force dist\windows\cert.pfx

      - name: Upload the signed Windows archives over the unsigned assets
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release upload $tag (Get-ChildItem dist\windows\freshen-*.zip).FullName --clobber

  finalize:
    name: refresh checksums.txt for the signed artifacts
    needs: [check-secrets, sign-macos, sign-windows]
    # Only when something was signed; a skipped signing job is not a failure.
    if: ${{ !cancelled() && !failure() && (needs.check-secrets.outputs.macos == 'true' || needs.check-secrets.outputs.windows == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download all release assets
        run: |
          mkdir -p dist
          gh release download "${{ steps.tag.outputs.tag }}" -D dist

      - name: Regenerate checksums.txt over the signed archives
        run: |
          cd dist
          shopt -s nullglob
          files=(freshen-*.tar.gz freshen-*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no archives or zips to checksum" >&2
            exit 0
          fi
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Upload checksums.txt over the stale unsigned one
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/checksums.txt --clobber
