# Publish freshen-lib and freshen to crates.io on every git tag matching `v*`.
#
# The library is published first: `freshen` depends on it, and crates.io
# rejects a crate that depends on a crate that is not yet published.
#
# It needs one repository secret that only a human can create
# (see HUMAN-TASKS.md, "Accounts and credentials for Milestone 11"):
#   CARGO_REGISTRY_TOKEN — a crates.io API token with the `publish` scope
#   (Settings -> Secrets and variables -> Actions -> New repository secret).
#
# Each git tag publishes exactly once: crates.io does not allow republishing
# the same version, so re-running for an already-published tag fails until
# that version is yanked.

name: release-crates-io

permissions:
  contents: read
  id-token: write
  attestations: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (for example v0.1.0)"
        required: true

concurrency:
  group: release-crates-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish freshen-lib and freshen to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Verify the tag matches the workspace version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "freshen") | .version')"
          [ -n "$version" ] || { echo "could not read the workspace version" >&2; exit 1; }
          [ "$tag" = "$version" ] || { echo "tag $tag does not match workspace version $version" >&2; exit 1; }

      # Without the token nothing can be published; say so instead of failing
      # every release of a project that does not publish to crates.io (yet).
      - name: Check for the crates.io token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish"
          fi

      - name: Publish freshen-lib to crates.io
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p freshen-lib --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish freshen to crates.io
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p freshen --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `cargo publish` leaves the packaged `.crate` files in target/package.
      - name: Generate the SBOM of the published sources
        if: steps.token.outputs.present == 'true' && !github.event.repository.private
        uses: anchore/sbom-action@v0.20.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM attestation for the published crates
        if: steps.token.outputs.present == 'true' && !github.event.repository.private
        uses: actions/attest-sbom@v1
        with:
          subject-path: target/package/*.crate
          sbom-path: sbom.spdx.json

      - name: Generate provenance attestation for the crates.io publish
        if: steps.token.outputs.present == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/package/*.crate
