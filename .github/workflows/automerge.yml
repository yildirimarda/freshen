# Puts PRs the agent opened with the "automated" label into the auto-merge
# queue. Once CI is green, GitHub merges them itself — the agent never has to
# wait around burning API requests.
#
# Two labels opt out:
#   blocked — the agent reported it got stuck, so a human should look
#   plan    — a change to PLAN.md, which is the one thing worth reviewing
#             yourself. A bad plan turns into twenty bad pull requests.

name: automerge

on:
  pull_request:
    # synchronize matters: on repos using the watch-fallback (no native
    # auto-merge), a push after open/label would otherwise leave the PR
    # unwatched forever. Native --auto repos are unaffected (it is sticky).
    types: [opened, labeled, reopened, synchronize]

# One watcher per PR — a new push cancels the stale watcher and starts a
# fresh one against the new head.
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Declaring a permissions block zeroes every permission not listed —
# checks:read is what lets the watcher poll check results (its absence was
# a hard-won lesson: silent 403s on every poll).
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  enable:
    if: |
      contains(github.event.pull_request.labels.*.name, 'automated') &&
      !contains(github.event.pull_request.labels.*.name, 'blocked') &&
      !contains(github.event.pull_request.labels.*.name, 'plan')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        # GITHUB_TOKEN merges do NOT trigger on:push workflows (GitHub's
        # recursion guard) — so release-please never sees bot-merged commits.
        # Set an AUTOMERGE_TOKEN repo secret (a PAT with Contents+PR write,
        # e.g. the gh-agent token) and merges count as yours, triggering
        # release-please immediately. Without it, everything still works;
        # release-please just waits for the next human push (or a manual
        # Actions -> release -> Run workflow).
        # Two paths. Where the auto-merge feature exists (public repos, paid
        # plans) branch protection gates the merge server-side, so --auto is
        # correct. Where it doesn't (private repos on the Free plan), `gh pr
        # merge --auto` would merge IMMEDIATELY — nothing blocks it — skipping
        # CI entirely. There we watch this PR's own checks and only merge
        # after they all pass.
        run: |
          # read repo settings with the PAT — allow_auto_merge is only visible
          # with push access, which the workflow token may lack
          allow="$(GH_TOKEN="$MERGE_TOKEN" gh api "repos/$REPO" --jq '.allow_auto_merge // false' 2>/dev/null || echo false)"
          if [ "$allow" = "true" ]; then
            GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$PR" --repo "$REPO"
          else
            echo "no auto-merge on this repo — watching this PR's checks instead"
            # NOT gh pr checks --watch: that waits for ALL checks including
            # THIS job, i.e. it deadlocks on itself. Poll the check-runs REST
            # API instead (stable shape), excluding our own job ("enable").
            sleep 30   # let CI register its check runs first
            for i in $(seq 1 55); do
              head_sha="$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)" || true
              counts="$(gh api "repos/$REPO/commits/$head_sha/check-runs" \
                --jq '[.check_runs[] | select(.name != "enable")]
                      | {fail: ([.[] | select(.conclusion != null
                                 and .conclusion != "success"
                                 and .conclusion != "skipped"
                                 and .conclusion != "neutral")] | length),
                         pending: ([.[] | select(.status != "completed")] | length),
                         total: length}')" || counts=""
              echo "poll $i: sha=${head_sha:0:9} counts=${counts:-<api error, see above>}"
              if [ -n "$counts" ]; then
                fail=$(echo "$counts" | jq .fail)
                pending=$(echo "$counts" | jq .pending)
                total=$(echo "$counts" | jq .total)
                if [ "$fail" -gt 0 ]; then
                  echo "checks failed — leaving the PR open for the loop's CI-fix cycle"
                  exit 1
                fi
                if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
                  GH_TOKEN="$MERGE_TOKEN" gh pr merge --squash "$PR" --repo "$REPO"
                  exit 0
                fi
              fi
              sleep 20
            done
            echo "timed out waiting for checks — leaving the PR open"
            exit 1
          fi
        env:
          # Reads (repo settings, PR checks) use the workflow's own token —
          # fine-grained PATs cannot read check results (no "Checks"
          # permission exists for them). Only the MERGE uses the PAT, so the
          # resulting push still triggers release-please.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
